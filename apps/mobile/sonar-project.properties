# SonarQube Project Configuration for Kini Frontend

# Project identification
sonar.projectKey=kini-front
sonar.projectName=Kini Frontend
sonar.projectVersion=1.0

# Source code location
sonar.sources=app

# SonarQube server configuration
sonar.host.url=http://localhost:9000
# Token: Use -Dsonar.login=token when running or set SONAR_TOKEN env variable
# sonar.login=${env.SONAR_TOKEN}

# Code coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/android/**,**/ios/**,**/coverage/**,**/build/**

# Test files location
sonar.tests=app
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript/React Native specific settings
sonar.typescript.node=node_modules/.bin/node

