# SonarQube Project Configuration for Kini API

# Project identification
sonar.projectKey=kini-api
sonar.projectName=Kini API
sonar.projectVersion=1.0

# Source code location
sonar.sources=src

# SonarQube server configuration
sonar.host.url=http://localhost:9000
# Token: Use -Dsonar.login=token when running or set SONAR_TOKEN env variable
# sonar.login=${env.SONAR_TOKEN}

# Code coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/test/**,**/*.spec.ts,**/*.e2e-spec.ts,**/coverage/**

# Test files location
sonar.tests=test
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific settings
sonar.typescript.node=node_modules/.bin/node

