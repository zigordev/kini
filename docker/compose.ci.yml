name: kini-ci

services:
  postgres:
    security_opt:
      - no-new-privileges:true
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kini
      POSTGRES_PASSWORD: kini
      POSTGRES_DB: kini
    ports:
      - '${CI_DB_PORT:-15434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20

  # The browser suite signs in through the real Google callback code, so CI
  # needs something that speaks OpenID Connect. Published on the host as well
  # as reachable on the network, because the authorization redirect goes
  # through the browser while the token and userinfo calls come from the API.
  #
  # Version 6 dropped the bundled logging backend, so this container is silent
  # whether it is healthy or dead. The healthcheck is the only thing that tells
  # the two apart.
  oauth:
    security_opt:
      - no-new-privileges:true
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      SERVER_PORT: '8080'
      JSON_CONFIG: '{"interactiveLogin":true,"tokenCallbacks":[{"issuerId":"kini","requestMappings":[{"requestParam":"code","match":"*","claims":{"email":"e2e@zigordev.test","email_verified":true,"name":"End To End"}}]}]}'
    ports:
      - '${CI_OAUTH_PORT:-3901}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://localhost:8080/kini/.well-known/openid-configuration >/dev/null 2>&1',
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    security_opt:
      - no-new-privileges:true
    init: true
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: local
    environment:
      NODE_ENV: test
      OTEL_SERVICE_NAME: kini-api
      OTEL_TRACES_ENABLED: 'false'
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: kini
      DATABASE_PASSWORD: kini
      DATABASE_NAME: kini
      DATABASE_SSL: 'false'
      DATABASE_SYNCHRONIZE: 'true'
      AUTH_CORS_ORIGINS: http://localhost:${CI_WEB_PORT:-3013}
      AUTH_SUCCESS_REDIRECT_URL: http://localhost:${CI_WEB_PORT:-3013}/auth/callback
      AUTH_FAILURE_REDIRECT_URL: http://localhost:${CI_WEB_PORT:-3013}/auth/callback
      SESSION_SECRET: ci-session-secret
      SESSION_COOKIE_SECRET: ci-cookie-secret
      SESSION_COOKIE_NAME: kini.sid
      SESSION_COOKIE_SECURE: 'false'
      SESSION_COOKIE_MAX_AGE_MS: '604800000'
      SESSION_COOKIE_SAME_SITE: lax
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:${CI_API_PORT:-3012}/auth/google/callback
      GOOGLE_AUTHORIZATION_URL: http://localhost:${CI_OAUTH_PORT:-3901}/kini/authorize
      GOOGLE_TOKEN_URL: http://oauth:8080/kini/token
      GOOGLE_USERINFO_URL: http://oauth:8080/kini/userinfo
      FRONTEND_URL: http://localhost:${CI_WEB_PORT:-3013}
      NOTIFICATIONS_KAFKA_BROKERS: platform-redpanda:9092
      NOTIFICATIONS_EMAIL_TOPIC: notification.email.requested.v1
      EDUARDO_LOSILLA_SYNC_ENABLED: 'false'
    ports:
      - '${CI_API_PORT:-3012}:3000'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/health >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    command: ['node', 'dist/main.js']

  web:
    security_opt:
      - no-new-privileges:true
    init: true
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: local
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${CI_API_PORT:-3012}
        NEXT_PUBLIC_RELEASE: ci
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${CI_API_PORT:-3012}
      NEXT_PUBLIC_RELEASE: ci
    ports:
      - '${CI_WEB_PORT:-3013}:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3001/health >/dev/null 2>&1']
      interval: 5s
      timeout: 3s
      retries: 20
