services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kini_api
    command: npm run start:dev
    environment:
      NODE_ENV: development
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5433
      DATABASE_USER: kini
      DATABASE_PASSWORD: kini
      DATABASE_NAME: kini
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:3000'
