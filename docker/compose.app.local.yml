name: kini-app-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
    labels: 'com.docker.compose.project,com.docker.compose.service'

services:
  kini_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kini}
    volumes:
      - app-local-pgdata:/var/lib/postgresql/data
    ports:
      - '15434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      default:
        aliases:
          - kini-postgres

  kini_api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: local
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: kini-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-kini}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_NAME: ${POSTGRES_DB:-kini}
      DATABASE_SSL: 'false'
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-true}
      AUTH_CORS_ORIGINS: ${AUTH_CORS_ORIGINS:?AUTH_CORS_ORIGINS is required}
      AUTH_SUCCESS_REDIRECT_URL: ${AUTH_SUCCESS_REDIRECT_URL:?AUTH_SUCCESS_REDIRECT_URL is required}
      AUTH_FAILURE_REDIRECT_URL: ${AUTH_FAILURE_REDIRECT_URL:?AUTH_FAILURE_REDIRECT_URL is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-kini.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_MAX_AGE_MS: ${SESSION_COOKIE_MAX_AGE_MS:-604800000}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?GOOGLE_CALLBACK_URL is required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3013}
      NOTIFICATIONS_KAFKA_BROKERS: ${NOTIFICATIONS_KAFKA_BROKERS:-platform-redpanda:9092}
      NOTIFICATIONS_EMAIL_TOPIC: ${NOTIFICATIONS_EMAIL_TOPIC:-notification.email.requested.v1}
      EDUARDO_LOSILLA_SYNC_ENABLED: ${EDUARDO_LOSILLA_SYNC_ENABLED:-true}
      EDUARDO_LOSILLA_QUINIELA_TICKET_URL: ${EDUARDO_LOSILLA_QUINIELA_TICKET_URL:-https://www.eduardolosilla.es/quiniela/boletos}
      EDUARDO_LOSILLA_QUINIELA_RESULTS_URL: ${EDUARDO_LOSILLA_QUINIELA_RESULTS_URL:-https://www.eduardolosilla.es/quiniela/ayudas/escrutinio}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?OPENBAO_TOKEN is required}
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: kini
      OPENBAO_REQUIRED_KEYS: SESSION_SECRET,SESSION_COOKIE_SECRET,GOOGLE_CLIENT_SECRET
    ports:
      - '3012:3000'
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/docs >/dev/null 2>&1']
      interval: 10s
      timeout: 4s
      retries: 12
    depends_on:
      kini_db:
        condition: service_healthy
    command:
      ['node', '/app/scripts/openbao-run.mjs', '--', 'node', 'dist/main.js']
    logging: *default-logging
    networks:
      default:
      platform_ops_shared:
        aliases:
          - kini-api

  kini_web:
    build:
      context: ..
      dockerfile: apps/ui/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3012}
        NEXT_PUBLIC_RELEASE: ${NEXT_PUBLIC_RELEASE:-local}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3012}
      NEXT_PUBLIC_RELEASE: ${NEXT_PUBLIC_RELEASE:-local}
    ports:
      - '${WEB_PORT:-3013}:3001'
    depends_on:
      kini_api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001 >/dev/null 2>&1']
      interval: 10s
      timeout: 4s
      retries: 12
    logging: *default-logging
    networks:
      default:

networks:
  platform_ops_shared:
    name: platform_ops_shared
    external: true

volumes:
  app-local-pgdata:
