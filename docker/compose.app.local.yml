name: kini-app-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
    labels: 'com.docker.compose.project,com.docker.compose.service'

services:
  kini_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kini}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kini}
    volumes:
      - app-local-pgdata:/var/lib/postgresql/data
    ports:
      - '15434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging
    networks:
      default:
        aliases:
          - kini-postgres

  kini_api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: kini-postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-kini}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_NAME: ${POSTGRES_DB:-kini}
      DATABASE_SSL: 'false'
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-true}
      AUTH_CORS_ORIGINS: ${AUTH_CORS_ORIGINS:?AUTH_CORS_ORIGINS is required}
      AUTH_SUCCESS_REDIRECT_URL: ${AUTH_SUCCESS_REDIRECT_URL:?AUTH_SUCCESS_REDIRECT_URL is required}
      AUTH_FAILURE_REDIRECT_URL: ${AUTH_FAILURE_REDIRECT_URL:?AUTH_FAILURE_REDIRECT_URL is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-kini.sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_MAX_AGE_MS: ${SESSION_COOKIE_MAX_AGE_MS:-604800000}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?GOOGLE_CALLBACK_URL is required}
      GOOGLE_MOBILE_REDIRECT_URI: ${GOOGLE_MOBILE_REDIRECT_URI:-kini://auth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:19006}
      NOTIFICATIONS_KAFKA_BROKERS: ${NOTIFICATIONS_KAFKA_BROKERS:-platform-redpanda:9092}
      NOTIFICATIONS_EMAIL_TOPIC: ${NOTIFICATIONS_EMAIL_TOPIC:-notification.email.requested.v1}
      EDUARDO_LOSILLA_SYNC_ENABLED: ${EDUARDO_LOSILLA_SYNC_ENABLED:-true}
      EDUARDO_LOSILLA_QUINIELA_TICKET_URL: ${EDUARDO_LOSILLA_QUINIELA_TICKET_URL:-https://www.eduardolosilla.es/quiniela/boletos}
      EDUARDO_LOSILLA_QUINIELA_RESULTS_URL: ${EDUARDO_LOSILLA_QUINIELA_RESULTS_URL:-https://www.eduardolosilla.es/quiniela/ayudas/escrutinio}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?OPENBAO_TOKEN is required}
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: kini
      OPENBAO_REQUIRED_KEYS: SESSION_SECRET,SESSION_COOKIE_SECRET,GOOGLE_CLIENT_SECRET
    volumes:
      - ../apps/api:/app
      - kini-api-node-modules:/app/node_modules
    ports:
      - '3012:3000'
    depends_on:
      kini_db:
        condition: service_healthy
    command:
      ['node', 'scripts/openbao-run.mjs', '--', 'npm', 'run', 'start:dev']
    logging: *default-logging
    networks:
      default:
      platform_ops_shared:
        aliases:
          - kini-api

  kini_mobile:
    build:
      context: ../apps/mobile
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: 0.0.0.0
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:3012}
      EXPO_PUBLIC_AUTH_CALLBACK_URL: ${EXPO_PUBLIC_AUTH_CALLBACK_URL:-http://localhost:3012/auth/google/callback}
    volumes:
      - ../apps/mobile:/app
      - kini-mobile-node-modules:/app/node_modules
      - kini-mobile-expo:/app/.expo
    ports:
      - '${EXPO_WEB_PORT:-19006}:8081'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    depends_on:
      - kini_api
    stdin_open: true
    tty: true
    logging: *default-logging

networks:
  platform_ops_shared:
    name: platform_ops_shared
    external: true

volumes:
  app-local-pgdata:
  kini-api-node-modules:
  kini-mobile-node-modules:
  kini-mobile-expo:
