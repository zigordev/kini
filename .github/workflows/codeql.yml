name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: github/codeql-action/init@1d5b923fe0d5d2c2ad4c58fe28b53a2fbad4c4a7 # v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@1d5b923fe0d5d2c2ad4c58fe28b53a2fbad4c4a7 # v4
        with:
          category: '/language:${{ matrix.language }}'
