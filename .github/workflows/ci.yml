name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate compose manifests
        env:
          POSTGRES_PASSWORD: kini
          AUTH_CORS_ORIGINS: http://localhost:3013
          AUTH_SUCCESS_REDIRECT_URL: http://localhost:3013/auth/callback
          AUTH_FAILURE_REDIRECT_URL: http://localhost:3013/auth/callback
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CALLBACK_URL: http://localhost:3012/auth/google/callback
          OPENBAO_TOKEN: ci-openbao-token
        run: |
          docker compose -f docker/compose.app.local.yml config > /dev/null
          docker compose -f docker/compose.ci.yml config > /dev/null

      - name: Lint workspaces
        run: npm run lint

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build workspaces
        run: npm run build

      - name: API tests with coverage
        run: npm run test:cov:api

      - name: Web tests
        run: npm run test -w @kini/web

      - name: Upload api coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action calls GET /pulls/{n}/commits to scope its scan to the PR's
    # own commits. The workflow-level `contents: read` above doesn't cover that
    # call, and Dependabot-triggered runs get no implicit permissions beyond
    # what's declared here — every Dependabot PR failed this job with a 403
    # until this was added.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  integration-e2e:
    name: Integration Smoke (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      - name: Compose up (postgres + api + web)
        run: docker compose -f docker/compose.ci.yml up -d --build kini_db kini_api kini_web

      - name: Wait for API
        run: |
          i=1
          while [ $i -le 60 ]; do
            if curl -fsS http://localhost:3012/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
            i=$((i+1))
          done
          docker compose -f docker/compose.ci.yml logs --no-color kini_api
          exit 1

      - name: Verify metrics endpoint
        run: |
          metrics="$(curl -fsS http://localhost:3012/metrics)"
          printf '%s\n' "$metrics" | grep -q 'http_requests_total'
          printf '%s\n' "$metrics" | grep -q 'http_request_duration_seconds_bucket'

      - name: Export OpenAPI spec
        run: |
          mkdir -p artifacts
          docker compose -f docker/compose.ci.yml exec -T kini_api sh -lc 'wget -qO- http://localhost:3000/docs-json' > artifacts/openapi.test.json

      - name: Regenerate web API contract
        run: npm run contract:gen:web -- artifacts/openapi.test.json apps/ui/src/lib/api/generated.ts

      # The contract is generated from the running API, so a route added or
      # renamed without regenerating it shows up here as a diff rather than as a
      # runtime 404 in the browser months later.
      - name: Enforce API contract drift
        run: git diff --exit-code -- apps/ui/src/lib/api/generated.ts

      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.ci.yml down -v

  security-supply-chain:
    name: Security + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      # A copyleft licence arriving through a transitive dependency can oblige
      # you to publish source you never intended to. Checked on every build
      # because the dangerous moment is when a licence *changes*.
      - name: Licence check (prod dependencies)
        run: node ./scripts/check-licences.mjs .

      - name: Audit dependencies (prod only, high+)
        run: npm run audit:prod:gate

      - name: Build prod images
        run: |
          docker build -f apps/api/Dockerfile --target runtime -t kini-api:ci . &
          pid_0=$!
          docker build -f apps/ui/Dockerfile --target runtime -t kini-web:ci . &
          pid_1=$!
          wait "$pid_0"
          wait "$pid_1"

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (kini-api:ci)
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0
        with:
          image: kini-api:ci
          format: spdx-json
          output-file: artifacts/sbom-kini-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (kini-web:ci)
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0
        with:
          image: kini-web:ci
          format: spdx-json
          output-file: artifacts/sbom-kini-web.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM files
        run: |
          test -s artifacts/sbom-kini-api.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-kini-api.spdx.json
          test -s artifacts/sbom-kini-web.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-kini-web.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            artifacts/sbom-kini-api.spdx.json
            artifacts/sbom-kini-web.spdx.json
          if-no-files-found: error

      - name: Trivy scan (kini-api:ci)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kini-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (kini-web:ci)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kini-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep rather than CodeQL: CodeQL code scanning on a *private* repository
    # requires GitHub Code Security, a paid add-on. The CodeQL workflow beside
    # this one is gated on `!repository.private` for that reason and never runs.
    # Semgrep needs no add-on, so this is the job that actually scans.
    #
    # Findings fail the build and appear in the job log. Uploading SARIF to the
    # Security tab needs the same paid add-on, so the log is the report.
    #
    # Excluded rules, each reviewed rather than waved through:
    #   missing-user: container hardening — backlog
    #   missing-user-entrypoint: container hardening — backlog
    #   writable-filesystem-service: container hardening — backlog
    #   no-new-privileges: container hardening — backlog
    #   ifs-tampering: IFS is saved and restored around the loop
    #   detected-generic-secret: entropy heuristic; gitleaks already covers secrets
    #   prototype-pollution-loop: read-only tree walks, guarded with hasOwnProperty; no assignment
    #   incomplete-sanitization: stripping '%' from a formatted percentage, not sanitisation
    #   detect-non-literal-regexp: locale comes from a fixed list, in a build script
    #   aws-subnet-has-public-ip-address: single public host by design; there is no NAT gateway
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Scan
        # `semgrep scan`, not `semgrep ci`: the latter expects a Semgrep AppSec
        # Platform token and behaves differently without one. `--error` is what
        # turns a finding into a failed job rather than a printed note.
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
