name: Release Please

on:
  push:
    branches: [main]
  # Every other release-please in the estate has this. Without it there was no
  # way to run this workflow at all while push events were being suppressed —
  # the one repository that could not be unblocked by hand.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        with:
          # GITHUB_TOKEN cannot open the release PR here: this repository has
          # "Allow GitHub Actions to create and approve pull requests" off, and
          # the run on 2026-09-04 failed on exactly that — "GitHub Actions is
          # not permitted to create or approve pull requests", after it had
          # already built the branch and commit. Leaving that setting off is
          # the safer posture, since the same toggle also lets any workflow
          # approve a PR. So release-please gets the PAT instead, which is what
          # gpool, notifications, platform-ops and design-system already do.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
